<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Tembuku - click an FDT</title>
  <defs>
    <linearGradient id="nila" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2463"/><stop offset="1" stop-color="#090c2b"/>
    </linearGradient>
    <linearGradient id="emas" x1="96" y1="96" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#nila)"/>
  <!-- map pin made of a kawung petal, with a targeting ring -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-dasharray="30 20" filter="url(#glow)"/>
  <path d="M128 36 V64 M128 192 V220 M36 128 H64 M192 128 H220" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round"/>
  <rect x="96" y="96" width="64" height="64" rx="14" transform="rotate(45 128 128)" fill="url(#emas)" filter="url(#glow)"/>
  <rect x="117" y="117" width="22" height="22" rx="5" transform="rotate(45 128 128)" fill="#1c2463"/>
</svg>
